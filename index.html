<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Notes</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Georgia, 'Times New Roman', serif;
      background: #f5f1e8;
      color: #26352f;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
      background: radial-gradient(circle at top right, #dce8dc, transparent 40%), #f5f1e8;
    }

    main {
      width: min(100%, 46rem);
      padding: clamp(2rem, 7vw, 5rem);
      border-top: 4px solid #ba6d4e;
      background: rgba(255, 253, 248, 0.82);
      box-shadow: 0 1.5rem 4rem rgba(38, 53, 47, 0.1);
    }

    p { line-height: 1.7; }
    .label { color: #ba6d4e; font: 700 0.8rem/1.2 sans-serif; letter-spacing: 0.14em; text-transform: uppercase; }
    h1 { margin: 0.75rem 0 1rem; font-size: clamp(2.5rem, 8vw, 5rem); font-weight: 400; line-height: 0.95; }
    .placeholder { max-width: 32rem; margin-bottom: 0; color: #53635b; font-size: 1.1rem; }
  </style>
</head>
<body>
  <main>
    <div class="label">A place for ideas</div>
    <h1>My Notes</h1>
    <p class="placeholder">This page is ready for your content. Edit <code>index.html</code> and push your changes to update it.</p>
  </main>
</body>
</html>
